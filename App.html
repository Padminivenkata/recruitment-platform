<script>
  /* ============================================================
     ProjectFlow web-app client.
     Talks to the Apps Script backend through google.script.run.
     ============================================================ */

  var root = document.getElementById('root');
  var modalRoot = document.getElementById('modal-root');
  var toastRoot = document.getElementById('toasts');

  var STATUSES = ['Backlog', 'In Progress', 'Blocked', 'Review', 'Done'];
  var STATUS_SLUG = { 'Backlog': 'backlog', 'In Progress': 'in-progress', 'Review': 'review', 'Blocked': 'blocked', 'Done': 'done' };
  var COLORS = { 'Backlog': '#94a3b8', 'In Progress': '#3b82f6', 'Review': '#8b5cf6', 'Blocked': '#ef4444', 'Done': '#10b981' };
  var TYPES = ['Epic', 'Story', 'Task', 'Bug', 'Subtask'];
  var PRIORITIES = ['Lowest', 'Low', 'Medium', 'High', 'Highest'];

  var S = {
    token: localStorage.getItem('pf_token') || '',
    user: null,
    boot: null,
    settings: null,
    users: [],
    departments: [],
    sprints: [],
    issues: [],
    recurring: [],
    capacity: null,
    reports: null,
    view: 'board',
    filters: { assigneeId: '', departmentId: '', type: '', priority: '', search: '', sprint: 'active' },
    detail: null,
    drawerTab: 'details',
    calMonth: new Date(),
    busy: false,
    error: '',
    authMode: 'login',
    dragging: null,
    selected: {},
    lastLoad: 0,
  };

  /* -------------------- utilities -------------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);
    return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function duration(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    if (sec < 60) return sec + 's';
    var d = Math.floor(sec / 86400);
    var h = Math.floor((sec % 86400) / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + m + 'm';
    return m + 'm';
  }
  function unitOptions(sel) {
    return '<option value="mins"' + (sel === 'mins' ? ' selected' : '') + '>mins</option>' +
      '<option value="hours"' + (sel === 'hours' ? ' selected' : '') + '>hours</option>';
  }
  function minutesToParts(totalMin) {
    totalMin = Math.round(Number(totalMin) || 0);
    if (totalMin > 0 && totalMin % 60 === 0) return { value: totalMin / 60, unit: 'hours' };
    return { value: totalMin || '', unit: 'mins' };
  }
  function toMinutes(value, unit) {
    if (value === '' || value === null || value === undefined) return '';
    var n = Number(value);
    if (isNaN(n)) return '';
    return Math.round(n * (unit === 'hours' ? 60 : 1));
  }
  function hoursToParts(h) {
    h = Number(h) || 0;
    if (!h) return { value: 1, unit: 'hours' };
    var mins = Math.round(h * 60);
    if (mins % 60 === 0) return { value: mins / 60, unit: 'hours' };
    return { value: mins, unit: 'mins' };
  }
  function toHours(value, unit) {
    if (value === '' || value === null || value === undefined) return '';
    var n = Number(value);
    if (isNaN(n)) return '';
    var h = unit === 'mins' ? n / 60 : n;
    return Math.round(h * 100) / 100;
  }
  function hoursToDisplay(h) {
    return duration(Math.round((Number(h) || 0) * 3600));
  }
  function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function fmtDateTime(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString(undefined, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function isOverdue(iso) {
    return iso && Date.parse(iso) < Date.now();
  }
  function ymd(d) { return d.toISOString().slice(0, 10); }
  function toDmy(v) {
    if (!v) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
    if (m) return m[3] + '-' + m[2] + '-' + m[1];
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var dd = ('0' + d.getDate()).slice(-2);
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    return dd + '-' + mm + '-' + d.getFullYear();
  }
  function fromDmy(s) {
    s = String(s || '').trim();
    if (!s) return '';
    var m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s);
    if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    var m2 = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m2) return m2[1] + '-' + ('0' + m2[2]).slice(-2) + '-' + ('0' + m2[3]).slice(-2);
    return null;
  }

  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    toastRoot.appendChild(el);
    setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2600);
    setTimeout(function () { el.remove(); }, 3000);
  }

  /* -------------------- backend call -------------------- */
  var READ_ACTIONS = ['bootstrap', 'me', 'settings', 'listUsers', 'listDepartments', 'listSprints', 'listIssues', 'reports', 'capacity', 'listRecurring', 'getIssue'];
  var inflightCalls = {};
  function rpc(action, params) {
    var key = READ_ACTIONS.indexOf(action) === -1 ? (action + '|' + JSON.stringify(params || {})) : null;
    if (key && inflightCalls[key]) return inflightCalls[key];
    var p = new Promise(function (resolve, reject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('This app must be opened from the deployed Web app URL.'));
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          var r;
          try { r = JSON.parse(res); } catch (e) { reject(new Error('Bad response from server')); return; }
          if (r.ok) resolve(r.data); else reject(new Error(r.error || 'Request failed'));
        })
        .withFailureHandler(function (err) { reject(err); })
        .api(action, JSON.stringify(params || {}), S.token);
    });
    if (key) {
      inflightCalls[key] = p;
      p.then(function () { delete inflightCalls[key]; }, function () { delete inflightCalls[key]; });
    }
    return p;
  }

  /* -------------------- lookups -------------------- */
  function userById(id) {
    for (var i = 0; i < S.users.length; i++) if (S.users[i].id === Number(id)) return S.users[i];
    return null;
  }
  function deptById(id) {
    for (var i = 0; i < S.departments.length; i++) if (S.departments[i].id === Number(id)) return S.departments[i];
    return null;
  }
  function sprintById(id) {
    for (var i = 0; i < S.sprints.length; i++) if (S.sprints[i].id === Number(id)) return S.sprints[i];
    return null;
  }
  function activeSprint() {
    for (var i = 0; i < S.sprints.length; i++) if (S.sprints[i].status === 'active') return S.sprints[i];
    return null;
  }
  function sprintDayInfo(s) {
    if (!s || !s.startDate) return null;
    var start = new Date(s.startDate + 'T00:00:00');
    if (isNaN(start.getTime())) return null;
    var end = s.endDate ? new Date(s.endDate + 'T00:00:00') : start;
    var ms = 864e5;
    var total = Math.max(1, Math.round((end - start) / ms) + 1);
    var noun = total === 1 ? ' day' : ' days';
    if (s.status === 'completed') return { day: total, total: total, label: total + noun + ' · completed' };
    if (s.status === 'active') {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var day = Math.round((today - start) / ms) + 1;
      if (day < 1) day = 1;
      return { day: day, total: total, label: 'Day ' + Math.min(day, total) + ' of ' + total };
    }
    return { day: null, total: total, label: total + noun + ' planned' };
  }
  /* ---- board sprint date-range calendar ---- */
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var boardCal = { open: false, month: null, start: '', end: '' };
  function pad2(n) { return ('0' + n).slice(-2); }
  function boardCalendarHtml() {
    if (!boardCal.month) boardCal.month = new Date();
    var m = boardCal.month, y = m.getFullYear(), mo = m.getMonth();
    var first = new Date(y, mo, 1);
    var startDow = (first.getDay() + 6) % 7;
    var days = new Date(y, mo + 1, 0).getDate();
    var now = new Date();
    var todayStr = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
    var dow = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
    var cells = dow.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    for (var i = 0; i < startDow; i++) cells += '<div class="pad"></div>';
    for (var d = 1; d <= days; d++) {
      var ds = y + '-' + pad2(mo + 1) + '-' + pad2(d);
      var cls = 'day';
      if (boardCal.start && ds === boardCal.start) cls += ' sel';
      if (boardCal.end && ds === boardCal.end) cls += ' sel';
      if (boardCal.start && boardCal.end && ds > boardCal.start && ds < boardCal.end) cls += ' in';
      if (ds === todayStr) cls += ' today';
      cells += '<div class="' + cls + '" data-action="board-cal-day" data-date="' + ds + '">' + d + '</div>';
    }
    var rangeTxt = boardCal.start ? (toDmy(boardCal.start) + ' → ' + (boardCal.end ? toDmy(boardCal.end) : '… pick end')) : 'Pick the start date';
    return '<div class="board-cal">' +
      '<div class="bc-head"><button class="iconbtn" data-action="board-cal-prev">‹</button>' +
      '<span>' + MONTH_NAMES[mo] + ' ' + y + '</span>' +
      '<button class="iconbtn" data-action="board-cal-next">›</button>' +
      '<span style="flex:1"></span><button class="iconbtn" data-action="board-cal-close">✕</button></div>' +
      '<div class="bc-grid">' + cells + '</div>' +
      '<div class="bc-foot muted">' + esc(rangeTxt) + '</div></div>';
  }
  function saveSprintRange(start, end) {
    var a = activeSprint();
    if (!a) return;
    rpc('updateSprint', { id: a.id, startDate: start, endDate: end })
      .then(function () {
        var sp = sprintById(a.id);
        if (sp) { sp.startDate = start; sp.endDate = end; }
        boardCal.open = false;
        toast('Sprint dates saved', 'ok');
        render();
      })
      .catch(function (e) { toast(e.message, 'err'); render(); });
  }
  function applyUserPrefs() {
    var p = (S.user && S.user.prefs) || {};
    if (p.boardSprint !== undefined && p.boardSprint !== null && p.boardSprint !== '') {
      S.filters.sprint = String(p.boardSprint);
    }
  }

  /* -------------------- filtering -------------------- */
  function filteredIssues() {
    var f = S.filters;
    var list = S.issues.slice();
    if (S.view === 'board') {
      if (f.sprint === 'active') {
        var a = activeSprint();
        list = a ? list.filter(function (i) { return i.sprintId === a.id; }) : [];
      } else if (f.sprint === 'none') {
        list = list.filter(function (i) { return !i.sprintId; });
      } else if (f.sprint && f.sprint !== 'all') {
        list = list.filter(function (i) { return i.sprintId === Number(f.sprint); });
      }
    }
    if (f.assigneeId) list = list.filter(function (i) { return i.assigneeId === Number(f.assigneeId); });
    if (f.departmentId) list = list.filter(function (i) { return i.departmentId === Number(f.departmentId); });
    if (f.type) list = list.filter(function (i) { return i.type === f.type; });
    if (f.priority) list = list.filter(function (i) { return i.priority === f.priority; });
    if (f.search) {
      var q = f.search.toLowerCase();
      list = list.filter(function (i) {
        return (i.title || '').toLowerCase().indexOf(q) !== -1 ||
          (i.key || '').toLowerCase().indexOf(q) !== -1 ||
          (i.description || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    return list;
  }

  /* -------------------- fragments -------------------- */
  function avatar(u, cls) {
    if (!u) return '<span class="avatar ' + (cls || '') + '" style="background:#cbd5e1;color:#475467" title="Unassigned">–</span>';
    return '<span class="avatar ' + (cls || '') + '" style="background:' + (u.color || '#6366f1') + '" title="' + esc(u.name) + '">' + esc(initials(u.name)) + '</span>';
  }
  function assigneeAvatar(issue, cls) {
    return avatar(issue.assigneeId ? { id: issue.assigneeId, name: issue.assigneeName, color: issue.assigneeColor } : null, cls);
  }
  function typeTag(t) {
    var label = { Epic: 'EPIC', Story: 'STORY', Task: 'TASK', Bug: 'BUG', Subtask: 'SUB' }[t] || t;
    return '<span class="tag t-' + esc(t) + '">' + esc(label) + '</span>';
  }
  function prioTag(p) {
    return '<span class="tag pr-' + esc(p) + '">' + esc(p) + '</span>';
  }
  function statusLabel(s) {
    var l = S.settings && S.settings.columnLabels;
    return (l && l[s]) || s;
  }
  function statusOptions(selected) { return options(STATUSES, selected, null, statusLabel); }
  function statusPill(s) { return '<span class="pill st-' + (STATUS_SLUG[s] || 'backlog') + '">' + esc(statusLabel(s)) + '</span>'; }
  function options(list, selected, valFn, labelFn) {
    return list.map(function (o) {
      var v = valFn ? valFn(o) : o;
      var l = labelFn ? labelFn(o) : o;
      return '<option value="' + esc(v) + '"' + (String(v) === String(selected) ? ' selected' : '') + '>' + esc(l) + '</option>';
    }).join('');
  }

  /* -------------------- data loading -------------------- */
  function loadData(silent) {
    if (!S.user) return Promise.resolve();
    if (!silent) S.busy = true;
    var jobs = [
      rpc('settings').then(function (d) { S.settings = d; }),
      rpc('listUsers').then(function (d) { S.users = d.users; }),
      rpc('listDepartments').then(function (d) { S.departments = d.departments; }),
      rpc('listSprints').then(function (d) { S.sprints = d.sprints; }),
      rpc('listIssues').then(function (d) { S.issues = d.issues; }),
    ];
    if (S.view === 'reports') jobs.push(rpc('reports').then(function (d) { S.reports = d; }));
    if (S.view === 'capacity') jobs.push(rpc('capacity').then(function (d) { S.capacity = d; }));
    if (S.view === 'recurring') jobs.push(rpc('listRecurring').then(function (d) { S.recurring = d.recurring; }));
    return Promise.all(jobs).then(function () {
      S.lastLoad = Date.now();
      S.busy = false;
      setLive(true);
    }).catch(function (e) {
      S.busy = false;
      if (String(e.message || e).indexOf('session') !== -1 || String(e.message || e).indexOf('sign in') !== -1) {
        signOutLocal();
      } else {
        toast(e.message || String(e), 'err');
      }
    });
  }

  function setLive(ok) {
    var el = document.getElementById('live-dot');
    if (el) el.style.background = ok ? '#34d399' : '#f87171';
  }

  /* ==================== RENDER ==================== */
  function render() {
    if (!S.user) { renderAuth(); return; }
    root.innerHTML =
      '<div class="app">' +
      topbar() +
      '<div class="shell">' + nav() + '<div class="main">' + viewHtml() + '</div></div>' +
      '</div>';
    afterRender();
  }

  function topbar() {
    return '<div class="topbar">' +
      '<div class="brand"><span class="logo">◧</span> ProjectFlow</div>' +
      '<div class="spacer"></div>' +
      '<span class="live"><span class="dot" id="live-dot"></span> live</span>' +
      '<button class="btn sm ghost" data-action="refresh" style="color:#fff;border-color:rgba(255,255,255,.25)">↻ Refresh</button>' +
      '<div class="who" data-action="profile" title="Your profile">' + avatar({ name: S.user.name, color: S.user.color }) +
      '<div><div class="name">' + esc(S.user.name) + '</div><div class="role">' + esc(S.user.role) + '</div></div></div>' +
      '<button class="btn sm ghost" data-action="logout" style="color:#fff">Sign out</button>' +
      '</div>';
  }

  function nav() {
    var open = S.issues.filter(function (i) { return i.status !== 'Done'; }).length;
    var mine = S.issues.filter(function (i) { return i.assigneeId === S.user.id && i.status !== 'Done'; }).length;
    function item(view, icon, label, badge) {
      /* Members only get the Board (+ their profile). Everything else is
         manager/admin-only, and the backend enforces the same rule. */
      if (S.user.role === 'member' && view !== 'board' && view !== 'profile') return '';
      return '<button data-action="nav" data-view="' + view + '" class="' + (S.view === view ? 'active' : '') + '">' +
        '<span class="ic">' + icon + '</span><span class="label-txt">' + label + '</span>' +
        (badge != null ? '<span class="count">' + badge + '</span>' : '') + '</button>';
    }
    var canManage = S.user.role === 'admin' || S.user.role === 'manager';
    return '<div class="nav">' +
      '<div class="section">Workspace</div>' +
      item('board', '▦', 'Active Sprint', null) +
      item('backlog', '☰', 'Backlog', open) +
      item('sprints', '◷', 'Sprints', null) +
      item('recurring', '↻', 'Recurring', null) +
      item('capacity', '◱', 'Capacity', null) +
      item('calendar', '▤', 'Calendar', null) +
      item('reports', '▨', 'Reports', null) +
      '<div class="section">You</div>' +
      item('mytasks', '★', 'My issues', mine) +
      '<div class="section">Manage</div>' +
      item('profile', '◔', 'Profile', null) +
      (canManage ? item('admin', '⚙', 'Administration', null) : '') +
      '</div>';
  }

  function viewHtml() {
    if (S.busy && !S.issues.length) return '<div class="loading"><span class="spin"></span> Loading…</div>';
    /* Defense in depth: block deep links even if the nav item was removed. */
    if (S.user.role === 'member' && S.view !== 'board' && S.view !== 'profile') return viewBoard();
    switch (S.view) {
      case 'board': return viewBoard();
      case 'backlog': return viewBacklog();
      case 'sprints': return viewSprints();
      case 'recurring': return viewRecurring();
      case 'capacity': return viewCapacity();
      case 'calendar': return viewCalendar();
      case 'reports': return viewReports();
      case 'admin': return viewAdmin();
      case 'profile': return viewProfile();
      case 'mytasks': return viewMyTasks();
      default: return viewBoard();
    }
  }

  /* -------------------- filters bar -------------------- */
  function filtersBar(extra) {
    return '<div class="toolbar">' +
      (extra || '<h2>' + esc(S.view.charAt(0).toUpperCase() + S.view.slice(1)) + '</h2>') +
      '<div class="toolbar-spacer"></div>' +
      '<div class="filters">' +
      '<div class="search"><span class="ic">⌕</span><input class="input" data-filter="search" placeholder="Search" value="' + esc(S.filters.search) + '"></div>' +
      '<select class="select" data-filter="assigneeId"><option value="">All assignees</option>' +
      options(S.users, S.filters.assigneeId, function (u) { return u.id; }, function (u) { return u.name; }) + '</select>' +
      '<select class="select" data-filter="departmentId"><option value="">All departments</option>' +
      options(S.departments, S.filters.departmentId, function (d) { return d.id; }, function (d) { return d.name; }) + '</select>' +
      '<select class="select" data-filter="type"><option value="">All types</option>' + options(TYPES, S.filters.type) + '</select>' +
      '<select class="select" data-filter="priority"><option value="">All priorities</option>' + options(PRIORITIES, S.filters.priority) + '</select>' +
      (S.filters.search || S.filters.assigneeId || S.filters.departmentId || S.filters.type || S.filters.priority
        ? '<button class="btn sm ghost" data-action="clear-filters">Clear</button>' : '') +
      '</div></div>';
  }

  /* -------------------- BOARD -------------------- */
  function issueCard(i) {
    var timer = '';
    if (i.status === 'In Progress' || i.status === 'Review') {
      timer = '<span class="mini timer" title="Cycle time (In Progress → Done)" data-since="' + esc(i.inProgressAt || i.updatedAt) + '">⟳ ' + duration((Date.now() - Date.parse(i.inProgressAt || i.updatedAt)) / 1000) + '</span>';
    } else if (i.status === 'Done' && i.cycleSeconds != null) {
      timer = '<span class="mini" title="Cycle time (In Progress → Done)">⟳ ' + duration(i.cycleSeconds) + '</span>';
    }
    return '<div class="kcard" data-issue="' + i.id + '" data-action="open-issue">' +
      '<div class="top">' + typeTag(i.type) + '<span class="key">' + esc(i.key) + '</span><span class="spacer"></span>' + prioTag(i.priority) +
      '<button class="iconbtn del card-del" title="Delete task" data-action="delete-card" data-id="' + i.id + '">🗑</button>' +
      '</div>' +
      '<div class="title">' + esc(i.title) + '</div>' +
      '<div class="meta">' +
      assigneeAvatar(i, 'sm') +
      (i.storyPoints != null ? '<span class="chip">' + esc(i.storyPoints) + ' pts</span>' : '') +
      (i.spentSeconds ? '<span class="mini">⏱ ' + duration(i.spentSeconds) + '</span>' : '') +
      (i.dueDate ? '<span class="mini ' + (isOverdue(i.dueDate) && i.status !== 'Done' ? 'overdue' : '') + '">⚑ ' + fmtDate(i.dueDate) + '</span>' : '') +
      '<span class="spacer"></span>' +
      (i.status === 'Blocked' ? '<span class="mini overdue">■ blocked</span>' : timer) +
      '</div></div>';
  }

  function viewBoard() {
    var a = activeSprint();
    var list = filteredIssues();
    var sprintSel = '<select class="select" data-filter="sprint">' +
      '<option value="active"' + (S.filters.sprint === 'active' ? ' selected' : '') + '>Active sprint' + (a ? ' · ' + esc(a.name) : ' (none)') + '</option>' +
      '<option value="all"' + (S.filters.sprint === 'all' ? ' selected' : '') + '>All issues</option>' +
      '<option value="none"' + (S.filters.sprint === 'none' ? ' selected' : '') + '>Backlog (no sprint)</option>' +
      S.sprints.map(function (s) { return '<option value="' + s.id + '"' + (String(S.filters.sprint) === String(s.id) ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') +
      '</select>';

    var canRename = S.user.role === 'admin';
    var cols = STATUSES.map(function (st) {
      var items = list.filter(function (i) { return i.status === st; });
      var pencil = canRename ? '<button class="iconbtn" title="Rename column" data-action="rename-column" data-status="' + esc(st) + '">✎</button>' : '';
      return '<div class="col" data-col="' + st + '">' +

      }
      sprintActions = '<span class="pill st-in-progress" id="b-days">' + esc(info ? info.label : 'Active') + '</span>' +
        dateCtl +
        (canManageSprint ? ' <button class="btn sm" data-action="complete-sprint" data-id="' + a.id + '">Stop sprint</button>' : '') +
        ' <button class="btn sm" data-action="edit-sprint" data-id="' + a.id + '">Edit sprint</button>';
    } else if (canManageSprint) {
      var planned = S.sprints.filter(function (s) { return s.status === 'planned'; });
      sprintActions = planned.length
        ? '<select class="select" id="board-start-sprint" style="max-width:200px">' +
          planned.map(function (s) { var d = sprintDayInfo(s); return '<option value="' + s.id + '">' + esc(s.name) + (d ? ' · ' + esc(d.label) : '') + '</option>'; }).join('') +
          '</select> <button class="btn sm primary" data-action="board-start">Start sprint</button>'
        : '<span class="muted">No sprint to start</span>';
    } else {
      sprintActions = '<span class="muted">No active sprint</span>';
    }
    var actions = '<button class="btn primary sm" data-action="new-issue">+ New issue</button>';
    return filtersBar('<h2>Active Sprint' + (a ? ' · ' + esc(a.name) : '') + '</h2>' + sprintSel + sprintActions + actions) +
      '<div class="content"><div class="board">' + cols + '</div></div>';
  }

  /* -------------------- BACKLOG -------------------- */

  /* -------------------- SPRINTS -------------------- */

        (s.status !== 'active' ? '<button class="btn sm primary" data-action="start-sprint" data-id="' + s.id + '">Start</button>' : '') +
        (s.status === 'active' ? '<button class="btn sm danger" data-action="complete-sprint" data-id="' + s.id + '">Stop</button>' : '') +
        '<button class="btn sm" data-action="edit-sprint" data-id="' + s.id + '">Edit</button>' +
        (s.status !== 'active' ? '<button class="btn sm danger" data-action="delete-sprint" data-id="' + s.id + '">Delete</button>' : '') +
        (dayInfo && dayInfo.total ? '<span class="muted" style="font-size:12px;margin-left:4px">' + esc(dayInfo.label) + '</span>' : '') +

        '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
        '<div class="muted" style="font-size:12px">' + s.stats.doneCount + '/' + s.stats.issueCount + ' done · ' +

  /* -------------------- CAPACITY -------------------- */
  function viewCapacity() {
    var c = S.capacity;
    var canManage = S.user.role === 'admin' || S.user.role === 'manager';
    var actions = '<button class="btn sm" data-action="nav" data-view="capacity">↻ Refresh</button>' +
      (canManage ? ' <button class="btn sm primary" data-action="rebuild-plan">Rebuild plan sheet</button>' : '');
    if (!c) return filtersBar('<h2>Capacity</h2>' + actions) + '<div class="content"><div class="empty">Loading…</div></div>';
    var range = c.range || {};
    var rangeLabel = esc(toDmy(range.from) || '—') + ' → ' + esc(toDmy(range.to) || '—') + (range.sprintName ? ' · ' + esc(range.sprintName) : ' (no active sprint)');
    function num(v) { return (v === null || v === undefined || v === '') ? '—' : (Math.round(Number(v) * 10) / 10); }
    function pct(v) { return (v === null || v === undefined || v === '' || isNaN(Number(v))) ? '—' : Math.round(Number(v) * 100) + '%'; }
    function statusChip(s) {
      if (!s) return '';
      var cls = s === 'Over capacity' ? 'st-blocked' : (s === 'At risk' ? 'st-in-progress' : 'st-done');
      return '<span class="pill ' + cls + '">' + esc(s) + '</span>';
    }
    var depts = (c.departments || []).map(function (d) {
      var pctv = d.availableHours ? Math.round((d.recurringHours + d.plannedHours) / d.availableHours * 100) : 0;
      return '<div class="card" style="padding:14px"><div style="display:flex;align-items:center;gap:8px">' +
        '<h3 style="margin:0;font-size:14px">' + esc(d.departmentName) + '</h3>' +
        '<span style="flex:1"></span><span class="muted">' + num(d.plannedHours) + 'h / ' + num(d.availableHours) + 'h</span></div>' +
        '<div class="progress" style="margin-top:6px"><span style="width:' + Math.max(0, Math.min(100, pctv)) + '%;background:' + (pctv > 100 ? '#ef4444' : '#3b82f6') + '"></span></div>' +
        '<div class="muted" style="font-size:12px;margin-top:6px">' + d.resources + ' people · ' + num(d.remainingHours) + 'h remaining · ' +
        num(d.recurringHours) + 'h recurring · ' + num(d.completedHours) + 'h done</div></div>';
    }).join('') || '<div class="empty">No capacity rows yet — use “Rebuild plan sheet”.</div>';

    var rows = (c.plan && c.plan.rows) || [];
    var head = ['Resource', 'Department', 'Sprint', 'Working Days', 'Holidays / Leave', 'Daily Hours (h)',
      'Available (h)', 'Recurring (h)', 'Planned (h)', 'Remaining (h)', 'Utilization', 'Completed (h)', 'Status'];
    var body = rows.map(function (r) {
      var over = Number(r.remainingCapacity) < 0;
      return '<tr>' +
        '<td class="t">' + esc(r.resource) + '</td>' +
        '<td>' + esc(r.department || '') + '</td>' +
        '<td class="muted">' + esc(r.sprint || '') + '</td>' +
        '<td class="num">' + num(r.workingDays) + '</td>' +
        '<td class="num">' + num(r.holidaysLeave) + '</td>' +
        '<td class="num">' + num(r.dailyHours) + '</td>' +
        '<td class="num">' + num(r.availableCapacity) + '</td>' +
        '<td class="num">' + num(r.recurringCommitment) + '</td>' +
        '<td class="num">' + num(r.plannedHours) + '</td>' +
        '<td class="num' + (over ? ' over' : '') + '">' + num(r.remainingCapacity) + '</td>' +
        '<td class="num">' + pct(r.capacityUtilization) + '</td>' +
        '<td class="num">' + num(r.completedHours) + '</td>' +
        '<td>' + statusChip(r.workloadStatus) + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="13" class="muted" style="padding:16px;text-align:center">No rows yet — use “Rebuild plan sheet”.</td></tr>';
    var table = '<div class="card" style="padding:0;overflow:auto"><table class="grid"><thead><tr>' +
      head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';

    return filtersBar('<h2>Capacity</h2>' + actions) + '<div class="content">' +
      '<div class="card" style="padding:12px 14px;margin-bottom:14px"><b>Sprint range</b> <span class="muted">' + rangeLabel + '</span></div>' +
      '<div class="label">By department</div><div class="grid">' + depts + '</div>' +
      '<div class="label" style="margin-top:18px">Capacity planning grid' +
      '<span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0"> — edit Working Days, Holidays / Leave, Daily Hours and Planned Hours in the <b>Capacity_Planning</b> tab; the rest recalculates live in the sheet.</span></div>' +
      table + '</div>';
  }

  /* -------------------- RECURRING -------------------- */
  var WEEKDAY_NAMES = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var FREQ_NAMES = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };
  function recurringWhen(r) {
    if (r.freq === 'weekly') return 'Every ' + (WEEKDAY_NAMES[r.weekday] || '—');
    if (r.freq === 'monthly') return 'Day ' + (r.dayOfMonth || '—') + ' of the month';
    return 'Every day';
  }
  function viewRecurring() {
    var manage = S.user.role !== 'member';
    var rows = (S.recurring || []).map(function (r) {
      return '<div class="brow"><span class="chip">' + esc(FREQ_NAMES[r.freq] || r.freq) + '</span>' +
        '<div class="grow"><div class="t">' + esc(r.title) + (r.active ? '' : ' <span class="muted">(paused)</span>') + '</div>' +
        '<div class="muted" style="font-size:12px">' + esc(recurringWhen(r)) + ' · ' + esc(hoursToDisplay(r.hours)) +

        (r.startDate ? ' · from ' + esc(toDmy(r.startDate)) : '') + '</div></div>' +

          '<button class="iconbtn" title="Edit" data-action="edit-recurring" data-id="' + r.id + '">✎</button>' +
          '<button class="iconbtn del" title="Delete" data-action="delete-recurring" data-id="' + r.id + '">✕</button>' +
          '</div>' : '') + '</div>';
    }).join('') || '<div class="empty">No recurring tasks. Add stand-ups, reports, and rituals.</div>';
    return filtersBar('<h2>Recurring tasks</h2>' +
      (manage ? '<button class="btn primary sm" data-action="new-recurring">+ New recurring</button>' : '')) +
      '<div class="content"><div class="card" style="padding:6px 14px">' + rows + '</div>' +
      '<div class="muted" style="margin-top:8px;font-size:12px">Occurrences appear on the active sprint board and count against capacity.</div></div>';

  function openRecurringForm(r) {
    r = r || {};
    var uOpts = S.users.filter(function (u) { return u.active; }).map(function (u) {
      return '<option value="' + u.id + '"' + (String(r.assigneeId) === String(u.id) ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    }).join('');
    var dOpts = S.departments.map(function (d) {
      return '<option value="' + d.id + '"' + (String(r.departmentId) === String(d.id) ? ' selected' : '') + '>' + esc(d.name) + '</option>';
    }).join('');
    var wOpts = [1, 2, 3, 4, 5, 6, 7].map(function (n) {
      return '<option value="' + n + '"' + (String(r.weekday) === String(n) ? ' selected' : '') + '>' + WEEKDAY_NAMES[n] + '</option>';

    var hparts = hoursToParts(r.hours);
    openModal('<div class="mh"><h3>' + (r.id ? 'Edit recurring task' : 'New recurring task') + '</h3><span style="flex:1"></span><button class="x" data-action="close-modal">✕</button></div>' +
      '<div class="mb">' +
      '<div class="field"><label class="label">Title</label><input class="input" id="r-title" value="' + esc(r.title || '') + '"></div>' +
      '<div class="row2"><div class="field"><label class="label">Assignee</label><select class="input" id="r-assignee"><option value="">Choose…</option>' + uOpts + '</select></div>' +
      '<div class="field"><label class="label">Department</label><select class="input" id="r-dept"><option value="">—</option>' + dOpts + '</select></div></div>' +
      '<div class="row2"><div class="field"><label class="label">Frequency</label><select class="input" id="r-freq">' +
      options(['daily', 'weekly', 'monthly'], r.freq || 'daily', null, function (f) { return FREQ_NAMES[f]; }) + '</select></div>' +
      '<div class="field"><label class="label">Time per occurrence</label><div class="row2" style="gap:6px"><input type="number" step="any" min="0" class="input" id="r-hours" value="' + esc(hparts.value) + '"><select class="select" id="r-hours-unit" style="max-width:92px">' + unitOptions(hparts.unit) + '</select></div></div></div>' +
      '<div class="row2"><div class="field"><label class="label">Weekday (weekly)</label><select class="input" id="r-weekday">' + wOpts + '</select></div>' +
      '<div class="field"><label class="label">Day of month (monthly)</label><input type="number" min="1" max="31" class="input" id="r-dom" value="' + esc(r.dayOfMonth || '') + '"></div></div>' +
      '<div class="row2"><div class="field"><label class="label">Start date</label><input type="date" class="input" id="r-start" value="' + esc(r.startDate || '') + '"></div>' +
      '<div class="field"><label class="label">End date (optional)</label><input type="date" class="input" id="r-end" value="' + esc(r.endDate || '') + '"></div></div>' +
      '<div class="field"><label class="label"><input type="checkbox" id="r-active"' + (r.active === false ? '' : ' checked') + '> Active</label></div>' +
      '</div><div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-recurring">Save</button></div>');
    S.editingRecurring = r.id || null;

  function saveRecurringForm() {
    var payload = {
      title: document.getElementById('r-title').value.trim(),
      assigneeId: document.getElementById('r-assignee').value,
      departmentId: document.getElementById('r-dept').value,
      freq: document.getElementById('r-freq').value,
      weekday: document.getElementById('r-weekday').value,
      dayOfMonth: document.getElementById('r-dom').value,
      hours: toHours(document.getElementById('r-hours').value, document.getElementById('r-hours-unit').value),
      startDate: document.getElementById('r-start').value,
      endDate: document.getElementById('r-end').value,
      active: document.getElementById('r-active').checked,
    };
    if (!payload.title) { toast('Title is required', 'err'); return; }
    if (!payload.assigneeId) { toast('Choose an assignee', 'err'); return; }
    var done;
    if (S.editingRecurring) { payload.id = S.editingRecurring; done = rpc('updateRecurring', payload); }
    else { done = rpc('createRecurring', payload); }
    return done.then(function () { toast('Recurring saved', 'ok'); closeModal(); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* -------------------- CALENDAR -------------------- */
  function viewCalendar() {
    var m = S.calMonth;
    var year = m.getFullYear(), month = m.getMonth();
    var first = new Date(year, month, 1);
    var start = new Date(first);
    start.setDate(1 - ((first.getDay() + 6) % 7));
    var dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var cells = dow.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var cursor = new Date(start);
    for (var c = 0; c < 42; c++) {
      var dayStart = new Date(cursor); dayStart.setHours(0, 0, 0, 0);
      var dayEnd = new Date(dayStart); dayEnd.setHours(23, 59, 59, 999);
      var out = cursor.getMonth() !== month;
      var isToday = dayStart.getTime() === today.getTime();
      var evs = '';
      S.sprints.forEach(function (s) {
        var sd = s.startDate ? new Date(s.startDate + 'T00:00:00') : null;
        if (sd && sd.getTime() === dayStart.getTime()) {
          evs += '<div class="ev sprint" title="' + esc(s.name) + '">▶ ' + esc(s.name) + '</div>';
        }
      });
      filteredIssues().forEach(function (i) {
        if (!i.dueDate) return;
        var dd = new Date(i.dueDate + 'T00:00:00');
        if (dd.getTime() === dayStart.getTime()) {
          evs += '<div class="ev" style="background:' + (COLORS[i.status] || '#94a3b8') + '" data-action="open-issue" data-id="' + i.id + '" title="' + esc(i.key + ' ' + i.title) + '">' + esc(i.key) + '</div>';
        }
      });
      cells += '<div class="day ' + (out ? 'out' : '') + ' ' + (isToday ? 'today' : '') + '">' +
        '<div class="dnum">' + cursor.getDate() + '</div>' + evs + '</div>';
      cursor.setDate(cursor.getDate() + 1);
    }
    var title = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    return '<div class="toolbar"><h2>Calendar</h2><span class="muted" style="margin-left:10px">Issues by due date · sprint starts</span>' +
      '<div class="toolbar-spacer"></div>' +
      '<button class="btn sm" data-action="cal-prev">‹</button>' +
      '<button class="btn sm" data-action="cal-today">Today</button>' +
      '<button class="btn sm" data-action="cal-next">›</button></div>' +
      '<div class="content"><div class="cal-head"><h3 style="margin:0">' + esc(title) + '</h3></div>' +
      '<div class="cal">' + cells + '</div></div>';
  }

  /* -------------------- REPORTS -------------------- */
  function viewReports() {
    if (!S.reports) return '<div class="loading"><span class="spin"></span> Building reports…</div>';
    var r = S.reports;
    function bars(rows, name, valKey, total) {
      if (!rows.length) return '<div class="empty">No data yet.</div>';
      var max = Math.max.apply(null, rows.map(function (x) { return x[valKey] || 0; }).concat([1]));
      return rows.map(function (x) {
        return '<div class="bar-row"><div class="nm">' +
          (x.color ? '<span class="avatar sm" style="background:' + x.color + '">' + esc(initials(x.name)) + '</span>' : '') +
          esc(x.name) + '</div>' +
          '<div class="track"><div class="fill" style="width:' + Math.round(((x[valKey] || 0) / max) * 100) + '%;background:' + (x.color || COLORS['In Progress']) + '"></div></div>' +
          '<div class="vol">' + duration(x[valKey] || 0) + '</div></div>';
      }).join('');
    }
    var t = r.totals;
    return '<div class="toolbar"><h2>Reports</h2><div class="toolbar-spacer"></div>' +
      '<span class="muted">Cycle time is measured from <b>In Progress</b> → <b>Done</b>.</span></div>' +
      '<div class="content">' +
      '<div class="stat-grid">' +
      stat(t.open, 'Open issues') + stat(t.done, 'Completed') +
      stat(duration(r.cycleTime.overall.avgSeconds), 'Avg cycle time') +
      stat(r.cycleTime.overall.count, 'Cycled issues') +
      stat(duration(t.spentSeconds), 'Time logged') +
      stat(duration(t.blockedSeconds), 'Time blocked') +
      '</div>' +

      '<div class="section-title">Cycle time by assignee</div>' +
      '<div class="card" style="padding:16px">' + bars(r.cycleTime.byUser, 'user', 'avgSeconds') + '</div>' +

      '<div class="section-title">Cycle time by department</div>' +
      '<div class="card" style="padding:16px">' + bars(r.cycleTime.byDepartment, 'department', 'avgSeconds') + '</div>' +

      '<div class="section-title">Cycle time per issue</div>' +
      '<div class="card" style="padding:0;overflow:hidden"><table class="grid"><thead><tr><th>Issue</th><th>Assignee</th><th>Department</th><th>Cycle time</th><th>Logged</th></tr></thead><tbody>' +
      (r.cycleTime.issues.length ? r.cycleTime.issues.map(function (i) {
        return '<tr class="clickable" data-action="open-issue" data-id="' + i.id + '"><td><span class="mono muted">' + esc(i.key) + '</span> ' + esc(i.title) + '</td>' +
          '<td>' + esc(i.assigneeName) + '</td><td>' + esc(i.departmentName) + '</td>' +
          '<td><b>' + duration(i.cycleSeconds) + '</b></td><td>' + duration(i.spentSeconds) + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">No completed issues yet</td></tr>') +
      '</tbody></table></div>' +

      '<div class="section-title">Time in status (all issues)</div>' +
      '<div class="card" style="padding:16px">' +
      r.timeInStatus.map(function (s) {
        var max = Math.max.apply(null, r.timeInStatus.map(function (x) { return x.totalSeconds; }).concat([1]));
        return '<div class="bar-row"><div class="nm">' + statusPill(s.status) + '</div>' +
          '<div class="track"><div class="fill" style="width:' + Math.round((s.totalSeconds / max) * 100) + '%;background:' + COLORS[s.status] + '"></div></div>' +
          '<div class="vol">' + duration(s.totalSeconds) + '</div></div>';
      }).join('') + '</div>' +

      '<div class="section-title">Weekly throughput</div>' +
      '<div class="card" style="padding:16px">' +
      (r.throughput.length ? r.throughput.map(function (w) {
        var max = Math.max.apply(null, r.throughput.map(function (x) { return x.count; }).concat([1]));
        return '<div class="bar-row"><div class="nm">Week of ' + esc(w.week) + '</div>' +
          '<div class="track"><div class="fill" style="width:' + Math.round((w.count / max) * 100) + '%;background:#10b981"></div></div>' +
          '<div class="vol">' + w.count + '</div></div>';
      }).join('') : '<div class="empty">No completions yet.</div>') + '</div>' +

      '<div class="section-title">Workload (open issues)</div>' +
      '<div class="card" style="padding:0;overflow:hidden"><table class="grid"><thead><tr><th>Member</th><th>Open</th><th>Points</th><th>Logged</th><th>Blocked</th><th>Overdue</th><th>By status</th></tr></thead><tbody>' +
      (r.workload.length ? r.workload.map(function (w) {
        return '<tr><td>' + avatar({ name: w.name, color: w.color }) + ' ' + esc(w.name) + '</td>' +
          '<td><b>' + w.open + '</b></td><td>' + w.points + '</td><td>' + duration(w.spentSeconds) + '</td>' +
          '<td>' + duration(w.blockedSeconds) + '</td>' +
          '<td>' + (w.overdue ? '<span class="overdue">' + w.overdue + '</span>' : '0') + '</td>' +
          '<td class="muted">' + w.byStatus.backlog + 'b · ' + w.byStatus.in_progress + 'p · ' + w.byStatus.review + 'r · ' + w.byStatus.blocked + 'x</td></tr>';
      }).join('') : '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No members</td></tr>') +
      '</tbody></table></div>' +
      '</div>';
  }
  function stat(v, l) { return '<div class="card stat"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }

  /* -------------------- PROFILE -------------------- */
  function viewProfile() {

  /* ==================== AUTH SCREEN ==================== */
  function authCanRegister() {
    var b = S.boot || {};
    return !!b.needsSetup || !!b.allowRegistration;
  }
  function renderAuth() {
    var b = S.boot || {};
    var canRegister = authCanRegister();
    if (!canRegister) S.authMode = 'login';
    var login = S.authMode === 'login';
    var hint = b.needsSetup
      ? '<div class="hint">No accounts yet — register the first account and you become the administrator.</div>'
      : (b.defaultAdmin ? '<div class="hint">Default admin: <b>' + esc(b.defaultAdmin) + '</b> / <b>admin123</b>. Change it after signing in.</div>' : '');
    root.innerHTML = '<div class="login-wrap"><div class="login">' +
      '<h1>◧ ProjectFlow</h1><div class="sub">Sign in to your team board</div>' +
      hint +
      (S.error ? '<div class="err">' + esc(S.error) + '</div>' : '') +
      '<div class="field"><label class="label">Email</label><input class="input" id="auth-email" type="email" autocomplete="username"></div>' +
      (login ? '' : '<div class="field"><label class="label">Full name</label><input class="input" id="auth-name" autocomplete="name"></div>') +
      '<div class="field"><label class="label">Password</label><input class="input" id="auth-pass" type="password" autocomplete="' + (login ? 'current-password' : 'new-password') + '"></div>' +
      '<button class="btn primary" style="width:100%;justify-content:center;padding:10px" data-action="submit-auth">' + (login ? 'Sign in' : 'Create account') + '</button>' +
      (canRegister ? '<div style="text-align:center;margin-top:14px">' +
        '<a href="#" data-action="toggle-auth">' + (login ? 'Need an account? Register' : 'Already registered? Sign in') + '</a></div>' : '') +
      '</div></div>';
    var pass = document.getElementById('auth-pass');
    if (pass) pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doAuth(); });
    var em = document.getElementById('auth-email');
    if (em) setTimeout(function () { em.focus(); }, 50);
  }

  function applyUserPrefs() {
    var p = (S.user && S.user.prefs) || {};
    if (p.boardSprint !== undefined && p.boardSprint !== null && p.boardSprint !== '') {
      S.filters.sprint = String(p.boardSprint);
    }
  }
  function doAuth() {
    var email = (document.getElementById('auth-email') || {}).value || '';
    var pass = (document.getElementById('auth-pass') || {}).value || '';
    var name = (document.getElementById('auth-name') || {}).value || '';
    S.error = '';
    var action = S.authMode === 'login' ? 'login' : 'register';
    var params = action === 'login' ? { email: email, password: pass } : { name: name, email: email, password: pass };
    return rpc(action, params).then(function (d) {
      S.token = d.token;
      localStorage.setItem('pf_token', d.token);
      S.user = d.user;
      S.view = 'board';
      applyUserPrefs();
      render();
      return loadData();
    }).then(render).catch(function (e) {
      S.error = e.message || String(e);
      renderAuth();
    });
  }

  function signOutLocal() {
    S.token = '';
    S.user = null;
    S.issues = [];
    localStorage.removeItem('pf_token');
    render();
  }

  /* ==================== EVENT WIRING ==================== */
  function afterRender() {
    if (S.detail) renderDetail();
    wireDnD();
    startTimerTick();
  }

  document.addEventListener('click', function (e) {
    if (S.suppressClick) { S.suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    if (e.target.classList && e.target.classList.contains('overlay')) { closeModal(); return; }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    var id = el.getAttribute('data-id') ? Number(el.getAttribute('data-id')) : null;

    if (a === 'toggle-auth') { e.preventDefault(); if (!authCanRegister()) return; S.authMode = S.authMode === 'login' ? 'register' : 'login'; S.error = ''; renderAuth(); return; }
    if (a === 'submit-auth') { guardedSubmit(el, function () { return doAuth(); }); return; }
    if (a === 'logout') { rpc('logout').catch(function () {}).then(signOutLocal); return; }
    if (a === 'noop') { return; }
    if (a === 'delete-card') {
      var card = S.issues.filter(function (x) { return Number(x.id) === id; })[0];
      confirmThen('Delete ' + (card ? card.key : 'this task') + '?', function () {
        rpc('deleteIssue', { id: id }).then(function () { toast('Task deleted', 'ok'); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
      });
      return;
    }
    if (a === 'refresh') { refresh(); return; }
    if (a === 'nav') {
      var targetView = el.getAttribute('data-view');
      if (S.user.role === 'member' && targetView !== 'board' && targetView !== 'profile') return;
      S.view = targetView; S.detail = null; closeModal(); render();
      if (S.view === 'reports' || S.view === 'capacity' || S.view === 'recurring') loadData().then(render); return;
    }
    if (a === 'clear-filters') { S.filters = { assigneeId: '', departmentId: '', type: '', priority: '', search: '', sprint: S.filters.sprint, planSprint: S.filters.planSprint }; render(); return; }
    if (a === 'open-issue') { e.stopPropagation(); openDetail(Number(el.getAttribute('data-id') || el.getAttribute('data-issue') || id)); return; }
    if (a === 'new-issue') { openIssueForm(null); return; }
    if (a === 'edit-issue') { openIssueForm(S.detail.issue); return; }
    if (a === 'close-modal') { closeModal(); return; }
    if (a === 'close-detail') { S.detail = null; closeModal(); render(); return; }
    if (a === 'detail-tab') { S.drawerTab = el.getAttribute('data-tab'); renderDetail(); return; }
    if (a === 'profile') { S.view = 'profile'; render(); return; }
    if (a === 'save-profile') { guardedSubmit(el, function () { return saveProfile(); }); return; }
    if (a === 'save-password') { guardedSubmit(el, function () { return savePassword(); }); return; }
    if (a === 'admin-tab') { S.adminTab = el.getAttribute('data-tab'); render(); return; }
    if (a === 'clear-demo-data') { confirmThen('Delete ALL demo data (issues, sprints, departments, non-admin users)? Your admin login is kept.', function () { rpc('clearDemoData').then(function () { toast('Demo data cleared', 'ok'); S.detail = null; refresh(); }).catch(function (e) { toast(e.message, 'err'); }); }); return; }
    if (a === 'new-user') { openUserForm(null); return; }
    if (a === 'edit-user') { openUserForm(userById(id)); return; }
    if (a === 'reset-pw') { openResetPw(userById(id)); return; }
    if (a === 'delete-user') { confirmThen('Delete user ' + (userById(id) || {}).name + '?', function () { rpc('deleteUser', { id: id }).then(function () { toast('User deleted', 'ok'); refresh(); }); }); return; }
    if (a === 'new-dept') { openDeptForm(null); return; }
    if (a === 'edit-dept') { openDeptForm(deptById(id)); return; }
    if (a === 'delete-dept') { confirmThen('Delete department ' + (deptById(id) || {}).name + '? Tasks keep going, but lose their department.', function () { rpc('deleteDepartment', { id: id }).then(function () { toast('Department deleted', 'ok'); refresh(); }); }); return; }
    if (a === 'new-sprint') { openSprintForm(null); return; }
    if (a === 'edit-sprint') { openSprintForm(sprintById(id)); return; }
    if (a === 'start-sprint') { confirmThen('Start this sprint? Any other active sprint will be completed.', function () { rpc('startSprint', { id: id }).then(function () { toast('Sprint started', 'ok'); refresh(); }).catch(function (e) { toast(e.message, 'err'); }); }); return; }
    if (a === 'board-start') {
      var bsEl = document.getElementById('board-start-sprint');
      var bsid = bsEl ? bsEl.value : '';
      if (!bsid) { toast('No sprint to start', 'err'); return; }
      confirmThen('Start this sprint? Any other active sprint will be completed.', function () {
        rpc('startSprint', { id: Number(bsid) }).then(function () { toast('Sprint started', 'ok'); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
      });
      return;
    }
    if (a === 'rebuild-plan') { guardedSubmit(el, function () { return rpc('rebuildCapacityPlan').then(function (r) { toast('Capacity plan rebuilt (' + r.rows + ' rows)', 'ok'); refresh(); }).catch(function (e) { toast(e.message, 'err'); }); }); return; }
    if (a === 'complete-sprint') { openCompleteSprint(sprintById(id)); return; }
    if (a === 'delete-sprint') { confirmThen('Delete this sprint? Its issues move back to the backlog.', function () { rpc('deleteSprint', { id: id }).then(function () { toast('Sprint deleted', 'ok'); refresh(); }); }); return; }
    if (a === 'cal-prev') { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); render(); return; }
    if (a === 'cal-next') { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); render(); return; }
    if (a === 'cal-today') { S.calMonth = new Date(); render(); return; }
    if (a === 'toggle-edit-issue') { openIssueForm(S.detail.issue); return; }
    if (a === 'delete-issue') {
      var iss = S.detail ? S.detail.issue : null;
      if (iss) confirmThen('Delete ' + iss.key + '?', function () { rpc('deleteIssue', { id: iss.id }).then(function () { toast('Issue deleted', 'ok'); S.detail = null; refresh(); }); });
      return;
    }
    if (a === 'bl-up') { reorderBacklog(id, -1); return; }
    if (a === 'bl-down') { reorderBacklog(id, 1); return; }
    if (a === 'bl-to-sprint') {
      var act = activeSprint();
      if (!act) { toast('Start or create a sprint first', 'err'); return; }
      moveIssue(id, { sprintId: act.id });
      toast('Moved to ' + act.name, 'ok');
      return;
    }
    if (a === 'bl-delete') {
      var bit = S.issues.filter(function (x) { return Number(x.id) === id; })[0] || {};
      confirmThen('Delete ' + (bit.key || 'this issue') + '?', function () { rpc('deleteIssue', { id: id }).then(function () { toast('Issue deleted', 'ok'); S.detail = null; refresh(); }).catch(function (e) { toast(e.message, 'err'); }); });
      return;
    }
    if (a === 'rename-column') {
      var st = el.getAttribute('data-status');
      var current = statusLabel(st);
      var name = window.prompt('Rename column "' + current + '"', current);
      if (name && name.trim() && name.trim() !== current) {
        rpc('setColumnLabel', { status: st, label: name.trim() }).then(function (d) { S.settings.columnLabels = d.columnLabels; toast('Column renamed', 'ok'); render(); }).catch(function (e) { toast(e.message, 'err'); });
      }
      return;
    }
    if (a === 'bl-select-all') {
      var bl = S.issues.filter(function (i) { return !i.sprintId && i.status !== 'Done'; });
      var allSel = bl.length && bl.every(function (i) { return S.selected[i.id]; });
      bl.forEach(function (i) { if (allSel) delete S.selected[i.id]; else S.selected[i.id] = true; });
      render();
      return;
    }
    if (a === 'move-selected') {
      var ids = Object.keys(S.selected).filter(function (k) { return S.selected[k]; });
      if (!ids.length) { toast('Select at least one issue', 'err'); return; }
      var tgt = document.getElementById('move-target');
      var val = tgt ? tgt.value : '';
      if (val === '') { toast('Choose a sprint', 'err'); return; }
      var sprintId = val === 'backlog' ? '' : Number(val);
      guardedSubmit(el, function () {
        var chain = Promise.resolve();
        ids.forEach(function (sid) { chain = chain.then(function () { return rpc('updateIssue', { id: Number(sid), sprintId: sprintId }); }); });
        return chain.then(function () { S.selected = {}; toast('Moved ' + ids.length + ' issue(s)', 'ok'); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
      });
      return;
    }
    if (a === 'new-recurring') { openRecurringForm(null); return; }
    if (a === 'edit-recurring') { openRecurringForm(S.recurring.filter(function (r) { return r.id === id; })[0]); return; }

  /* -------------------- drag & drop -------------------- */
  function zoneOf(node) {
    if (!node || !node.closest) return null;
    return node.closest('[data-drop]');
  }
  function clearZoneHighlight() {
    document.querySelectorAll('.drag-over').forEach(function (n) { n.classList.remove('drag-over'); });
  }
  function highlightZone(zone) {
    clearZoneHighlight();
    if (!zone) return;
    if (zone.classList.contains('dropzone')) { zone.classList.add('drag-over'); return; }
    var col = zone.closest('.col');
    if (col) col.classList.add('drag-over');
  }
  function applyDrop(zone, issueId) {
    if (!zone || !issueId) return;
    var kind = zone.getAttribute('data-drop');
    if (kind === 'status') {
      var st = zone.getAttribute('data-status');
      var issue = S.issues.filter(function (i) { return String(i.id) === String(issueId); })[0];
      if (issue && issue.status !== st) setStatus(Number(issueId), st, true);
    } else if (kind === 'backlog') {
      moveIssue(Number(issueId), { sprintId: '' });
    } else if (kind === 'sprint') {
      moveIssue(Number(issueId), { sprintId: Number(zone.getAttribute('data-sprint')) });
    }
  }
  function endDragVisual() {
    S.dragging = null;
    document.body.classList.remove('dragging-active');
    document.querySelectorAll('.dragging').forEach(function (n) { n.classList.remove('dragging'); });
    clearZoneHighlight();
    var g = document.getElementById('drag-ghost');
    if (g && g.parentNode) g.parentNode.removeChild(g);
  }

  function wireDnD() {
    wirePointerDrag();
  }

  /* Pointer-based drag. Native HTML5 drag events never fire inside the Apps
     Script sandboxed iframe, so we drag with pointer events instead. This
     also makes the board work with a mouse, trackpad, pen and touch. The
     ghost is moved with a GPU transform, coalesced to one update per frame,
     which keeps the motion smooth even with many cards on screen. */
  function wirePointerDrag() {
    document.querySelectorAll('[data-issue]').forEach(function (el) {
      el.addEventListener('pointerdown', function (e) {
        if (e.button != null && e.button !== 0) return;
        if (e.target.closest('[data-action]:not([data-action="open-issue"])')) return;
        var startX = e.clientX, startY = e.clientY;
        var issueId = el.getAttribute('data-issue');
        var pointerId = e.pointerId;
        var rect = el.getBoundingClientRect();
        var offsetX = startX - rect.left, offsetY = startY - rect.top;
        var started = false;
        var ghost = null;
        var rafId = 0;
        var pendingX = startX, pendingY = startY;

        function placeGhost() {
          rafId = 0;
          if (!ghost) return;
          ghost.style.transform = 'translate3d(' + (pendingX - offsetX) + 'px,' + (pendingY - offsetY) + 'px,0)';
        }
        function scheduleGhost(x, y) {
          pendingX = x; pendingY = y;
          if (!rafId) rafId = requestAnimationFrame(placeGhost);
        }
        function zoneAt(x, y) {
          if (ghost) ghost.style.visibility = 'hidden';
          var over = document.elementFromPoint(x, y);
          if (ghost) ghost.style.visibility = '';
          return zoneOf(over);
        }

        function move(ev) {
          if (ev.pointerId !== pointerId) return;
          if (!started) {
            if (Math.abs(ev.clientX - startX) < 6 && Math.abs(ev.clientY - startY) < 6) return;
            started = true;
            S.dragging = issueId;
            document.body.classList.add('dragging-active');
            el.classList.add('dragging');
            ghost = el.cloneNode(true);
            ghost.id = 'drag-ghost';
            ghost.classList.add('drag-ghost');
            ghost.style.width = rect.width + 'px';
            ghost.style.left = '0';
            ghost.style.top = '0';
            ghost.style.transform = 'translate3d(' + (startX - offsetX) + 'px,' + (startY - offsetY) + 'px,0)';
            document.body.appendChild(ghost);
            try { el.setPointerCapture(pointerId); } catch (x) {}
          }
          scheduleGhost(ev.clientX, ev.clientY);
          highlightZone(zoneAt(ev.clientX, ev.clientY));
          if (ev.cancelable) ev.preventDefault();
        }
        function up(ev) {
          if (ev.pointerId !== pointerId) return;
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
          document.removeEventListener('pointercancel', up);
          if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
          if (started) {
            S.suppressClick = true;
            applyDrop(zoneAt(ev.clientX, ev.clientY), issueId);
          }
          endDragVisual();
        }
        document.addEventListener('pointermove', move, { passive: false });
        document.addEventListener('pointerup', up);
        document.addEventListener('pointercancel', up);
      });
    });
  }

  /* -------------------- actions -------------------- */
  function refresh() { loadData().then(render); }

  function setStatus(id, status, silent) {
    rpc('setStatus', { id: id, status: status }).then(function () {
      if (!silent) toast('Moved to ' + statusLabel(status), 'ok');
      if (S.detail && S.detail.issue.id === id) { openDetail(id, S.drawerTab); }
      refresh();
    }).catch(function (e) { toast(e.message, 'err'); });
  }
  function moveIssue(id, patch) {
    rpc('updateIssue', { id: id, sprintId: patch.sprintId }).then(function () { refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }
  function reorderBacklog(id, dir) {
    var list = S.issues.filter(function (i) { return !i.sprintId && i.status !== 'Done'; });
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (Number(list[i].id) === Number(id)) { idx = i; break; }
    if (idx < 0) return;
    var j = idx + dir;
    if (j < 0 || j >= list.length) return;
    var tmp = list[idx]; list[idx] = list[j]; list[j] = tmp;
    var updates = [];
    list.forEach(function (it, k) {
      var oi = (k + 1) * 10;
      if (Number(it.orderIndex || 0) !== oi) updates.push({ id: it.id, orderIndex: oi, version: it.version });
    });
    if (!updates.length) return;
    var chain = Promise.resolve();
    updates.forEach(function (u) { chain = chain.then(function () { return rpc('updateIssue', u); }); });
    chain.then(function () { refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }
  function addComment() {
    var ta = document.getElementById('comment-body');
    if (!ta || !ta.value.trim()) return;
    return rpc('addComment', { id: S.detail.issue.id, body: ta.value }).then(function () { ta.value = ''; openDetail(S.detail.issue.id, S.drawerTab); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* -------------------- modal system -------------------- */
  function openModal(html) { modalRoot.innerHTML = '<div class="overlay"><div class="modal">' + html + '</div></div>'; }
  function closeModal() { modalRoot.innerHTML = ''; }
  function confirmThen(msg, fn) {
    openModal('<div class="mh"><h3>Please confirm</h3></div><div class="mb">' + esc(msg) + '</div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button>' +
      '<button class="btn danger" id="confirm-ok">Confirm</button></div>');
    document.getElementById('confirm-ok').onclick = function () { closeModal(); fn(); };
  }
  function guardedSubmit(btn, fn) {
    if (btn && btn.disabled) return;
    var prev;
    if (btn) {
      prev = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('is-busy');
      btn.innerHTML = 'Working…';
    }
    var reset = function () { if (btn) { btn.disabled = false; btn.classList.remove('is-busy'); btn.innerHTML = prev; } };
    var p;
    try { p = fn(); } catch (e) { reset(); throw e; }
    if (p && typeof p.then === 'function') { p.then(reset, reset); } else { reset(); }
  }

  function saveIssueForm() {
    var payload = {
      type: document.getElementById('f-type').value,
      priority: document.getElementById('f-priority').value,
      title: document.getElementById('f-title').value.trim(),
      description: document.getElementById('f-desc').value,

        (S.detail.children.length ? '<div style="margin-top:16px"><div class="label">Sub-tasks</div>' + S.detail.children.map(function (c) { return '<div class="brow" data-action="open-issue" data-id="' + c.id + '">' + typeTag(c.type) + '<span class="mono muted">' + esc(c.key) + '</span><div class="grow">' + esc(c.title) + '</div>' + statusPill(c.status) + '</div>'; }).join('') + '</div>' : '');
    } else if (tab === 'comments') {
      body = '<div style="margin-bottom:12px"><textarea class="textarea" id="comment-body" placeholder="Write a comment…"></textarea>' +
        '<div style="margin-top:8px"><button class="btn primary sm" data-action="add-comment">Comment</button></div></div>' +
        (S.detail.comments.length ? S.detail.comments.map(function (c) {
          return '<div class="comment">' + avatar({ name: c.authorName, color: c.authorColor }) +
            '<div class="grow"><div style="display:flex;gap:8px;align-items:center"><b>' + esc(c.authorName) + '</b><span class="muted" style="font-size:11px">' + fmtDateTime(c.createdAt) + '</span></div>' +
            '<div style="white-space:pre-wrap">' + esc(c.body) + '</div></div></div>';
        }).join('') : '<div class="empty">No comments yet.</div>');
    } else if (tab === 'history') {
      body = '<div class="timeline">' + (S.detail.history.length ? S.detail.history.map(function (h) {
        return '<div class="ev">' + (h.fromStatus ? esc(h.fromStatus) + ' → ' : 'created as ') + '<b>' + esc(h.toStatus) + '</b>' +
          '<div class="muted">' + esc(h.actorName || 'System') + ' · ' + fmtDateTime(h.at) + '</div></div>';
      }).join('') : '<div class="muted">No history.</div>') + '</div>';

    }

    var canManage = true;
    modalRoot.innerHTML = '<div class="drawer-overlay" data-action="close-detail"></div><div class="drawer">' +
      '<div class="mh">' + typeTag(i.type) + '<span class="mono muted">' + esc(i.key) + '</span><h3 style="flex:1;margin-left:8px">' + esc(i.title) + '</h3>' +
      '<button class="x" data-action="close-detail">✕</button></div>' +
      '<div class="body">' + tabs + body + '</div>' +
      '<div class="mf"><button class="btn danger sm" data-action="delete-issue">Delete</button><span class="spacer"></span>' +
      (canManage ? '<button class="btn primary sm" data-action="toggle-edit-issue">Edit</button>' : '') + '</div></div>';
  }
  function row(k, v) { return '<div class="k">' + esc(k) + '</div><div>' + v + '</div>'; }

  /* -------------------- sprint forms -------------------- */
  function openSprintForm(sprint) {
    var s = sprint || {};
    openModal('<div class="mh"><h3>' + (sprint ? 'Edit sprint' : 'New sprint') + '</h3><span style="flex:1"></span><button class="x" data-action="close-modal">✕</button></div>' +
      '<div class="mb"><div class="field"><label class="label">Name</label><input class="input" id="s-name" value="' + esc(s.name || '') + '"></div>' +
      '<div class="field"><label class="label">Goal</label><textarea class="textarea" id="s-goal">' + esc(s.goal || '') + '</textarea></div>' +
      '<div class="row"><div class="field"><label class="label">Start date</label><input type="date" class="input" id="s-start" value="' + esc(s.startDate || '') + '"></div>' +
      '<div class="field"><label class="label">End date</label><input type="date" class="input" id="s-end" value="' + esc(s.endDate || '') + '"></div></div></div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-sprint">Save</button></div>');
    S.editingSprint = sprint ? sprint.id : null;
  }
  function saveSprintForm() {
    var payload = { name: document.getElementById('s-name').value.trim(), goal: document.getElementById('s-goal').value };
    payload.startDate = document.getElementById('s-start').value || '';
    payload.endDate = document.getElementById('s-end').value || '';
    if (!payload.name) { toast('Sprint name is required', 'err'); return; }
    var done;
    if (S.editingSprint) { payload.id = S.editingSprint; done = rpc('updateSprint', payload); }
    else { done = rpc('createSprint', payload); }
    return done.then(function () { toast('Sprint saved', 'ok'); closeModal(); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }
  function openCompleteSprint(sprint) {
    openModal('<div class="mh"><h3>Complete ' + esc(sprint.name) + '</h3></div><div class="mb">' +
      '<div class="field"><label class="label">Move unfinished issues to</label><select class="select" id="cs-move"><option value="">Backlog</option>' +
      options(S.sprints.filter(function (s) { return s.id !== sprint.id && s.status !== 'completed'; }), '', function (s) { return s.id; }, function (s) { return s.name; }) + '</select></div></div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-complete-sprint">Complete sprint</button></div>');
    S.completingSprint = sprint.id;
  }
  function saveCompleteSprint() {
    return rpc('completeSprint', { id: S.completingSprint, moveTo: document.getElementById('cs-move').value }).then(function () { toast('Sprint completed', 'ok'); closeModal(); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* -------------------- user forms -------------------- */
  function openUserForm(user) {
    var u = user || {};
    openModal('<div class="mh"><h3>' + (user ? 'Edit user' : 'New user') + '</h3><span style="flex:1"></span><button class="x" data-action="close-modal">✕</button></div>' +
      '<div class="mb"><div class="row"><div class="field"><label class="label">Name</label><input class="input" id="u-name" value="' + esc(u.name || '') + '"></div>' +
      '<div class="field"><label class="label">Title</label><input class="input" id="u-title" value="' + esc(u.title || '') + '"></div></div>' +
      '<div class="field"><label class="label">Email</label><input class="input" id="u-email" value="' + esc(u.email || '') + '"></div>' +
      (user ? '' : '<div class="field"><label class="label">Temporary password</label><input class="input" id="u-pass" placeholder="min 6 characters"></div>') +
      '<div class="row"><div class="field"><label class="label">Role</label><select class="select" id="u-role">' + options(['member', 'manager', 'admin'], u.role || 'member') + '</select></div>' +
      '<div class="field"><label class="label">Department</label><select class="select" id="u-dept"><option value="">None</option>' + options(S.departments, u.departmentId, function (d) { return d.id; }, function (d) { return d.name; }) + '</select></div></div>' +
      '<div class="row"><div class="field"><label class="label">Hours per day</label><input type="number" step="0.5" min="0" class="input" id="u-hours" value="' + esc(u.hoursPerDay != null && u.hoursPerDay !== '' ? u.hoursPerDay : '') + '" placeholder="default 6"></div>' +
      '<div class="field"><label class="label">Work days (1=Mon … 7=Sun)</label><input class="input" id="u-workdays" value="' + esc(u.workDays || '') + '" placeholder="1,2,3,4,5"></div></div>' +
      (user ? '<div class="field"><label class="label"><input type="checkbox" id="u-active" ' + (u.active ? 'checked' : '') + '> Active</label></div>' : '') +
      '</div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-user">Save</button></div>');
    S.editingUser = user ? user.id : null;
  }
  function saveUserForm() {
    var payload = {
      name: document.getElementById('u-name').value.trim(),
      title: document.getElementById('u-title').value,
      email: document.getElementById('u-email').value.trim(),
      role: document.getElementById('u-role').value,
      departmentId: document.getElementById('u-dept').value,
      hoursPerDay: document.getElementById('u-hours').value,
      workDays: document.getElementById('u-workdays').value,
    };
    var passEl = document.getElementById('u-pass');
    if (passEl) payload.password = passEl.value;
    var activeEl = document.getElementById('u-active');
    if (activeEl) payload.active = activeEl.checked;
    if (!payload.name) { toast('Name is required', 'err'); return; }
    var done;
    if (S.editingUser) { payload.id = S.editingUser; done = rpc('updateUser', payload); }
    else { done = rpc('createUser', payload); }
    return done.then(function () { toast('User saved', 'ok'); closeModal(); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }
  function openResetPw(user) {
    openModal('<div class="mh"><h3>Reset password for ' + esc(user.name) + '</h3></div><div class="mb"><div class="field"><label class="label">New password</label><input class="input" id="rp-pass" placeholder="min 6 characters"></div></div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-reset-pw">Reset</button></div>');
    S.resettingUser = user.id;
  }
  function saveResetPw() {
    return rpc('resetPassword', { id: S.resettingUser, password: document.getElementById('rp-pass').value }).then(function () { toast('Password reset', 'ok'); closeModal(); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* -------------------- department forms -------------------- */
  function openDeptForm(dept) {
    var d = dept || {};
    openModal('<div class="mh"><h3>' + (dept ? 'Edit department' : 'New department') + '</h3><span style="flex:1"></span><button class="x" data-action="close-modal">✕</button></div>' +
      '<div class="mb"><div class="field"><label class="label">Name</label><input class="input" id="d-name" value="' + esc(d.name || '') + '"></div>' +
      '<div class="field"><label class="label">Colour</label><input type="color" class="input" id="d-color" value="' + esc(d.color || '#6366f1') + '" style="height:40px;padding:4px"></div>' +
      '<div class="row"><div class="field"><label class="label">Hours per day</label><input type="number" step="0.5" min="0" class="input" id="d-hours" value="' + esc(d.hoursPerDay != null && d.hoursPerDay !== '' ? d.hoursPerDay : '') + '" placeholder="default 6"></div>' +
      '<div class="field"><label class="label">Work days (1=Mon … 7=Sun)</label><input class="input" id="d-workdays" value="' + esc(d.workDays || '') + '" placeholder="1,2,3,4,5"></div></div></div>' +
      '<div class="mf"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-dept">Save</button></div>');
    S.editingDept = dept ? dept.id : null;
  }
  function saveDeptForm() {
    var payload = { name: document.getElementById('d-name').value.trim(), color: document.getElementById('d-color').value,
      hoursPerDay: document.getElementById('d-hours').value, workDays: document.getElementById('d-workdays').value };
    if (!payload.name) { toast('Name is required', 'err'); return; }
    var done;
    if (S.editingDept) { payload.id = S.editingDept; done = rpc('updateDepartment', payload); }
    else { done = rpc('createDepartment', payload); }
    return done.then(function () { toast('Department saved', 'ok'); closeModal(); refresh(); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* -------------------- live timers + polling -------------------- */
  var tickTimer = null;
  function startTimerTick() {
    if (tickTimer) return;
    tickTimer = setInterval(function () {
      document.querySelectorAll('[data-since]').forEach(function (el) {
        var since = el.getAttribute('data-since');
        if (!since) return;
        el.textContent = duration((Date.now() - Date.parse(since)) / 1000);
      });
    }, 1000);
  }

  function startPolling() {
    setInterval(function () {
      if (!S.user) return;
      if (modalRoot.innerHTML) return;
      var ae = document.activeElement;
      if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
      if (document.hidden) return;
      loadData(true).then(function () { if (!S.detail) render(); });
    }, 12000);
    window.addEventListener('focus', function () { if (S.user) loadData(true).then(render); });
  }

  /* ==================== BOOT ==================== */
  function boot() {
    rpc('bootstrap').then(function (b) {
      S.boot = b;
      if (!S.token) { renderAuth(); return; }
      return rpc('me').then(function (d) { S.user = d.user; applyUserPrefs(); return loadData(); }).then(render).catch(function () { S.token = ''; localStorage.removeItem('pf_token'); renderAuth(); });
    }).catch(function (e) {
      root.innerHTML = '<div class="login-wrap"><div class="login"><h1>◧ ProjectFlow</h1><div class="err">' + esc(e.message || String(e)) + '</div><div class="muted">Open this app from the deployed Web app URL and run <b>setupProject</b> from the Apps Script editor.</div></div></div>';
    });
  }

  boot();
  startPolling();
</script>
