<style>
  :root {

  /* ---------- layout ---------- */

  .topbar .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }

  .input, .select, .textarea {

  .t-Epic { color: #7c3aed; } .t-Story { color: #059669; } .t-Task { color: #2563eb; } .t-Bug { color: #dc2626; } .t-Subtask { color: #64748b; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .content { padding: 18px; overflow: auto; flex: 1; min-height: 0; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  .col-head .count { margin-left: auto; background: #fff; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); font-weight: 700; }

  .kcard { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; box-shadow: var(--shadow); cursor: grab; }
  .kcard:hover { border-color: #c7cff0; transform: translateY(-1px); }
  .kcard.dragging { opacity: .45; }
  .kcard, .brow { touch-action: none; }

  .drag-ghost { position: fixed; left: 0; top: 0; z-index: 9999; pointer-events: none; opacity: .94; background: #fff; border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 16px 38px rgba(15,23,42,.32); rotate: -1.5deg; will-change: transform; }

  /* ---------- calendar ---------- */

  .cal .day.out { background: #f8fafc; color: #b8c0cc; }
  .cal .day.today { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(79,70,229,.15); }
  .cal .dnum { font-size: 12px; font-weight: 700; color: #475467; margin-bottom: 4px; }
  .cal .ev { font-size: 10.5px; padding: 2px 5px; border-radius: 4px; margin-bottom: 3px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

  /* ---------- board sprint date calendar ---------- */
  .cal-wrap { position: relative; display: inline-flex; }

  .board-cal .bc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .board-cal .bc-grid .dow, .board-cal .bc-grid .pad { font-size: 10px; color: #98a2b3; text-align: center; padding: 4px 0; }
  .board-cal .bc-grid .day { text-align: center; padding: 6px 0; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .board-cal .bc-grid .day:hover { background: #eef2ff; }
  .board-cal .bc-grid .day.in { background: #e0e7ff; }
  .board-cal .bc-grid .day.sel { background: var(--brand); color: #fff; }
  .board-cal .bc-grid .day.today { outline: 1px solid var(--brand); }

  /* ---------- reports ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .stat { padding: 14px 16px; }
  .stat .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row .nm { width: 190px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
  .bar-row .track { flex: 1; background: #eef1f6; border-radius: 6px; height: 20px; position: relative; }
  .bar-row .fill { height: 100%; border-radius: 6px; background: var(--brand); min-width: 2px; }
  .bar-row .vol { width: 96px; text-align: right; font-weight: 700; font-size: 12px; color: #475467; }
  .section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #667085; margin: 22px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* ---------- modal / drawer ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(16,24,40,.5); display: flex; z-index: 50; animation: fade .12s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  .x { border: 0; background: transparent; font-size: 18px; color: #98a2b3; line-height: 1; padding: 4px 8px; border-radius: 6px; }
  .x:hover { background: #f2f4f7; color: #475467; }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 640px; max-width: 100vw; background: #fff; box-shadow: var(--shadow-lg); z-index: 41; display: flex; flex-direction: column; animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(30px); opacity: .6 } to { transform: none; opacity: 1 } }
  .drawer .mh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer .mh h3 { margin: 0; font-size: 16px; flex: 1; }
  .drawer .body { padding: 18px; overflow: auto; flex: 1; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 10px 14px; align-items: center; }
  .kv .k { font-size: 12px; font-weight: 700; color: #667085; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; padding: 8px 12px; font-weight: 600; color: #667085; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
  .comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f2f4f7; }
  .comment .grow { flex: 1; }
  .timeline { position: relative; padding-left: 16px; }
  .timeline .ev { position: relative; padding: 0 0 14px 12px; border-left: 2px solid var(--line); font-size: 12px; }
  .timeline .ev::before { content: ''; position: absolute; left: -6px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }

  /* ---------- toast ---------- */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
  .toast { background: #101828; color: #fff; padding: 11px 14px; border-radius: 9px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500; max-width: 380px; animation: fade .15s; }

  .toast.ok { background: #067647; }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(1200px 600px at 20% -10%, #4f46e5, #1e1b4b 55%, #0b1020); padding: 20px; }
  .login { width: 400px; max-width: 100%; background: #fff; border-radius: 16px; padding: 30px; box-shadow: var(--shadow-lg); }
  .login h1 { margin: 0 0 4px; font-size: 22px; }

  .spin { width: 16px; height: 16px; border: 2px solid #c7cff0; border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  @media (max-width: 900px) {

    .nav button { justify-content: center; }
    .split { grid-template-columns: 1fr; }
    .drawer { width: 100vw; }
  }
</style>
